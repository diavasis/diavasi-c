name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgrpc-dev
      - name: Check the tag and build
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/publish.sh
